<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omar Raju - Realtime Data Input</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input[type="text"] { width: 75%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #data-list { margin-top: 20px; list-style-type: none; padding: 0; }
        #data-list li { padding: 10px; background: #e9ecef; margin-bottom: 5px; border-radius: 4px; border-left: 5px solid #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2>রিয়েল-টাইম ডাটা ইনপুট</h2>
    
    <!-- ইনপুট বক্স এবং বাটন -->
    <input type="text" id="userInput" placeholder="কিছু একটা লিখুন...">
    <button id="sendBtn">পাঠান</button>

    <!-- যেখানে সব ব্যবহারকারীর ডেটা লাইভ দেখাবে -->
    <ul id="data-list"></ul>
</div>

<!-- Firebase SDK এবং স্ক্রিপ্ট লজিক -->
<script type="module">
  // প্রয়োজন অনুযায়ী Firebase মডিউলগুলো CDN থেকে ইম্পোর্ট করা হলো
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

  // আপনার নিজস্ব Firebase কনফিগারেশন অবজেক্ট
  const firebaseConfig = {
    apiKey: "AIzaSyBtx55_nV7uXMLATP7k8VoyF9NInxQzcHI",
    authDomain: "omar-raju.firebaseapp.com",
    databaseURL: "https://omar-raju-default-rtdb.firebaseio.com", // আপনার প্রজেক্টের সঠিক ডাটাবেজ ইউআরএল
    projectId: "omar-raju",
    storageBucket: "omar-raju.firebasestorage.app",
    messagingSenderId: "564184337856",
    appId: "1:564184337856:web:5b0b1a97b18aa7670c4c25",
    measurementId: "G-096XRV8RMR"
  };

  // Firebase এবং অন্যান্য সার্ভিস ইনিশিয়ালাইজ করা হলো
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const database = getDatabase(app);
  const messagesRef = ref(database, 'messages');

  // DOM উপাদানগুলো সিলেক্ট করা হলো
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const dataList = document.getElementById('data-list');

  // বাটন ক্লিকের মাধ্যমে ডাটাবেজে তথ্য পাঠানো (Push করা)
  sendBtn.addEventListener('click', () => {
      const text = userInput.value.trim();
      if (text !== "") {
          push(messagesRef, {
              text: text,
              timestamp: Date.now()
          });
          userInput.value = ""; // ইনপুট বক্সটি খালি করা হলো
      }
  });

  // ডাটাবেজে নতুন তথ্য আসামাত্র রিয়েল-টাইমে তা রিসিভ করে পেজে দেখানো
  onChildAdded(messagesRef, (snapshot) => {
      const data = snapshot.val();
      const li = document.createElement('li');
      li.textContent = data.text;
      dataList.appendChild(li);
  });
</script>

</body>
</html>
